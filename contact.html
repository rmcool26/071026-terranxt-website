<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Request a demo | Terranxt</title>
<meta name="description" content="Request a pvNXT demo. Tell us your role and we will show you how it fits your work.">
<meta name="theme-color" content="#069fb1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght@20..48,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<main>

<section class="container section two-col">
  <div class="stack-20"><div class="eyebrow">CONTACT</div><h1>Request a demo.</h1>
  <p class="lead">Tell us your role. We will show you how pvNXT fits your work.</p>
  <div class="stack-14">
    <div class="row top"><span class="ms accent">location_on</span>B-305 KLJ Noida One Building, Sector 62, Noida, Uttar Pradesh 201309</div>
    <div class="row top"><span class="ms accent">mail</span><a href="mailto:info@terranxt.com">info@terranxt.com</a></div>
  </div></div>
  <div class="card form-card">
    <div id="form-done" hidden class="stack-12"><span class="ms big">check_circle</span><h2 class="h-xs">Thanks. We will be in touch.</h2><span class="muted">Usually within one working day.</span></div>
    <form id="demo-form" class="stack-16">
      <label>Name<input name="name" type="text" required></label>
      <label>Work email<input name="email" type="email" required></label>
      <label>I am a<select name="role"><option>EPC company</option><option>Installer</option><option>Homeowner</option><option>O&amp;M team</option><option>Investor</option><option>Other</option></select></label>
      <label>Message <span class="muted">(optional)</span><textarea name="message" rows="3"></textarea></label>
      <button class="btn btn-primary" type="submit">Send request</button>
    </form>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
